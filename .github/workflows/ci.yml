name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build + Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Compile Solidity
        working-directory: packages/janus-token
        run: npm run compile

      # Note: typecheck / hardhat unit tests / SDK vitest are not wired yet for
      # this package. E2E tests (test:e2e) require a funded testnet COA and
      # private keys, so they run out-of-band, not in CI. Re-add steps here as
      # those scripts land.
